services:
  glpi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GLPI_VERSION: "11.0.11"
    ports:
      - "8080:80"
    volumes:
      # Mount the plugin source directly into GLPI's plugins directory
      - ..:/var/www/glpi/plugins/assetqr:cached
      # GLPI config, files and logs survive rebuilds
      - glpi-data:/var/lib/glpi
      - glpi-logs:/var/log/glpi
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
    volumes:
      - db-data:/var/lib/mysql

volumes:
  glpi-data:
  glpi-logs:
  db-data:
